pre-commit:
  jobs:
    - run: bunx ultracite fix
      glob:
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
      stage_fixed: true

pre-push:
  jobs:
    - name: check changed files
      files: git diff --name-only --diff-filter=ACMRT origin/main..HEAD
      run: bunx ultracite check {files}
      glob:
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
    - name: typecheck
      run: bun run typecheck
