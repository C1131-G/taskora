# Local development services only: PostgreSQL and MinIO. No service publishes a
# host port here; docker-compose.override.yml (loaded automatically) does.
name: taskora

services:
  # The one PostgreSQL instance for Taskora. `restart: always` brings it back
  # whenever Docker Desktop starts, so there is never a second copy to manage.
  postgres:
    image: postgres:18-alpine
    container_name: taskora-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-taskora}
    volumes:
      - taskora-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-taskora} -d ${POSTGRES_DB:-taskora}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: server
    container_name: taskora-minio
    restart: always
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-taskora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
      MINIO_API_CORS_ALLOW_ORIGIN: ${S3_BROWSER_ORIGIN:-http://localhost:3000}
    volumes:
      - taskora-minio-data:/data

  minio-init:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: client
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >-
        for attempt in $$(seq 1 30); do if mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc ready local; then mc mb --ignore-existing "local/$${S3_BUCKET}"; exit $$?; fi; sleep 2; done; exit 1
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-taskora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
      S3_BUCKET: ${S3_BUCKET:-taskora-private}
    restart: "no"

volumes:
  taskora-postgres-data:
  taskora-minio-data:
