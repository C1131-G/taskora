# Local development ports. `docker compose` loads this file automatically, so
# `bun run db:up` publishes Postgres and MinIO to the host.
services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5434}:5432"

  minio:
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
