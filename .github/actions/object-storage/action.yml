name: Object storage
description: >-
  Starts MinIO on localhost:9000 with one bucket. MinIO ships its security release as source only, so the binaries are built once per Dockerfile change and then restored from the cache instead of rebuilt in every job.
inputs:
  bucket:
    description: Bucket to create.
    required: true
runs:
  using: composite
  steps:
    - name: Restore object storage binaries
      id: cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.cache/taskora-minio
        key: ${{ runner.os }}-minio-${{ hashFiles('docker/minio.Dockerfile') }}
    - name: Build object storage binaries
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/.cache/taskora-minio
        for target in server client; do
          docker build -f docker/minio.Dockerfile --target "$target" -t "taskora-minio-$target:ci" .
          container=$(docker create "taskora-minio-$target:ci")
          binary=$([ "$target" = server ] && echo minio || echo mc)
          docker cp "$container:/usr/local/bin/$binary" ~/.cache/taskora-minio/"$binary"
          docker rm "$container"
        done
    - name: Start object storage
      shell: bash
      env:
        MINIO_ROOT_USER: ${{ env.S3_ACCESS_KEY_ID }}
        MINIO_ROOT_PASSWORD: ${{ env.S3_SECRET_ACCESS_KEY }}
        MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://localhost:3001
        BUCKET: ${{ inputs.bucket }}
      run: |
        nohup ~/.cache/taskora-minio/minio server --address :9000 "$RUNNER_TEMP/minio-data" > "$RUNNER_TEMP/minio.log" 2>&1 &
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://localhost:9000/minio/health/live; then break; fi
          sleep 1
        done
        curl --fail http://localhost:9000/minio/health/live || { cat "$RUNNER_TEMP/minio.log"; exit 1; }
        MC_HOST_local="http://$MINIO_ROOT_USER:$MINIO_ROOT_PASSWORD@localhost:9000" \
          ~/.cache/taskora-minio/mc mb --ignore-existing "local/$BUCKET"
